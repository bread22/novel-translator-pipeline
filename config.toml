[paths]
output_root = "output"
translation_policy = "docs/prompts/erotic-novel-policy.md"

[roles]
primary_translator = "nemotron"
fallback_translators = [
    "gemini_lite",
    "deepseek",
]
fallback_translator = "gemini_lite"
secondary_fallback_translator = "deepseek"
reviewer = "nemotron"
secondary_reviewer = "gemini_lite"
dual_review = true
fallback_reviewers = [
    "deepseek",
]

[providers.opencode]
type = "opencode"
binary = "opencode"
model = "opencode/muse-spark-1.2-contributor-free"
agent = ""
timeout = 600

[providers.opencode_reviewer]
type = "opencode"
binary = "opencode"
model = "opencode/muse-spark-1.2-contributor-free"
agent = ""
timeout = 600

[providers.gemini]
type = "antigravity"
agy = "agy"
model = "gemini-3.7-flash"
effort = "low"
timeout = 600
concurrency = 1
context_tokens = 1048576

[providers.muse]
type = "opencode"
binary = "opencode"
model = "opencode/muse-spark-1.2-contributor-free"
agent = ""
timeout = 600

[providers.mimo]
type = "opencode"
binary = "opencode"
model = "opencode/mimo-v2.5-free"
agent = ""
timeout = 600

[providers.hy3]
type = "opencode"
binary = "opencode"
model = "opencode/hy3-free"
agent = ""
timeout = 600

[providers.antigravity]
type = "antigravity"
agy = "agy"
model = "gemini-3.7-flash"
effort = "low"
timeout = 600
concurrency = 1
context_tokens = 1048576

[providers.lmstudio]
type = "openai"
base_url = "http://127.0.0.1:1234/v1"
model = "murasaki-14b-v0.2"
api_key = "lm-studio"
context_tokens = 8192
timeout = 600

[providers.codex]
type = "codex"
binary = "codex"
model = ""
timeout = 600

[providers.nemotron]
type = "openai"
base_url = "https://integrate.api.nvidia.com/v1"
model = "nvidia/nemotron-3-ultra-550b-a55b"
api_key = "$NVIDIA_API_KEY"
context_tokens = 131072
timeout = 600
thinking = false

[providers.nemotron.chat_template_kwargs]
thinking = false

[providers.gemini_lite]
type = "openai"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.5-flash-lite"
api_key = "$GEMINI_API_KEY"
context_tokens = 1048576
timeout = 600

[providers.deepseek]
type = "openai"
base_url = "https://integrate.api.nvidia.com/v1"
model = "deepseek-ai/deepseek-v4-flash-0731"
api_key = "$DEEPSEEK_API_KEY"
context_tokens = 131072
timeout = 600

[providers.online_api]
type = "openai"
base_url = "https://integrate.api.nvidia.com/v1"
model = "deepseek-ai/deepseek-v4-flash-0731"
api_key = "$DEEPSEEK_API_KEY"
context_tokens = 131072
timeout = 600

[pipeline]
max_cycles = 1000
max_chapter_batches = 1000
primary_batch_max_chars = 1500
max_provider_split_depth = 2
split_on_content_filter = false
translation_max_tokens = 8192
health_check_timeout = 120
layout = "horizontal"

[queue]
source_root = "source"
max_cycles = 1000
apply = true
autonomous = true
finalize = true
stop_on_error = false
layout = "horizontal"
