[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-translator-pipeline"
dynamic = ["version"]
description = "Universal AI Novel Translation and Consistency Review Pipeline for Novel Translator"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "opencc-py==1.4.2",
    "opencc-data==1.4.2",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["translator*"]

[tool.setuptools.dynamic]
version = {attr = "translator.version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["artifacts", "frontend", "output", "source", "translated", ".git", ".venv"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
# Gate correctness errors in legacy-compatible modules; formatting is handled
# separately so compatibility re-exports do not fail a release.
select = ["E7", "E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
packages = ["translator"]
ignore_missing_imports = true
warn_unused_ignores = false
