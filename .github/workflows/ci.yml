name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install constrained development dependencies
        run: python -m pip install -c constraints/py310-313.txt -e '.[dev]'
      - name: Compile
        run: python -m compileall -q translator scripts tests
      - name: Test with coverage
        run: python -m pytest -q --cov=translator --cov-report=term-missing --cov-report=xml
      - name: Focused import and security regressions
        run: python -m pytest -q tests/test_import_order.py tests/test_security_regressions.py

  backend-quality-package:
    name: Backend / quality and clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -c constraints/py310-313.txt -e '.[dev]' build
      - run: ruff check translator scripts tests
      - run: mypy translator
      - run: python scripts/check_version_consistency.py
      - run: python scripts/check_frontend_api_contract.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/release-smoke
          /tmp/release-smoke/bin/pip install dist/*.whl
          /tmp/release-smoke/bin/python -c "import importlib.metadata as m; import translator; from translator.web.app import create_app; assert m.version('novel-translator-pipeline') == translator.__version__ == create_app().version"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Verify every built asset reference
        working-directory: .
        run: python scripts/verify_frontend_dist.py --dist frontend/dist
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  integration:
    name: Integration / Uvicorn and Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -c constraints/py310-313.txt -e .
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Uvicorn/API/SPA/upload smoke test
        run: |
          python scripts/start_web.py --port 8000 > /tmp/novel-studio.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:8000/health && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8000/ > /tmp/index.html
          asset=$(grep -oE '/assets/[^" ]+\.js' /tmp/index.html | head -1)
          curl --fail --silent "http://127.0.0.1:8000${asset}" > /dev/null
          curl --fail --silent http://127.0.0.1:8000/api/v1/books > /dev/null
          curl --fail --silent http://127.0.0.1:8000/api/v1/queue > /dev/null
          printf 'Chapter One\nfixture text\n' > /tmp/fixture.txt
          curl --fail --silent -F file=@/tmp/fixture.txt http://127.0.0.1:8000/api/v1/books/upload > /tmp/upload.json
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: python scripts/generate_release_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: artifacts/release/0.3.0/*
