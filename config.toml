# Novel Translator unified parameters. Values here are the runtime source of truth.

[paths]
output_root = "output"
translation_policy = "docs/prompts/translation-policy.md"

[roles]
primary_translator = "antigravity"
fallback_translators = ["opencode", "lmstudio"]
fallback_translator = "opencode"
secondary_fallback_translator = "lmstudio"
reviewer = "opencode"

[providers.antigravity]
type = "antigravity"
agy = "agy"
model = "gemini-3.7-flash"
effort = "low"
timeout = 600
concurrency = 1
context_tokens = 1048576

[providers.opencode]
type = "opencode"
binary = "opencode"
model = "opencode/x-preview-f-free"
agent = ""
timeout = 600

[providers.lmstudio]
type = "openai"
base_url = "http://127.0.0.1:1234/v1"
model = "murasaki-14b-v0.2"
api_key = "lm-studio"
context_tokens = 8192
timeout = 600

[providers.codex]
type = "codex"
binary = "codex"
model = ""
reasoning_effort = ""
timeout = 600

[providers.online_api]
type = "openai"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key = "sk-..."
context_tokens = 65536
timeout = 600

[pipeline]
max_cycles = 1000
max_chapter_batches = 1000
primary_batch_max_chars = 4000
max_provider_split_depth = 2 # 遇到审查/格式错误时最多允许二分拆分深度；设为 2 表示最多二分 2 次即直接转入 fallback
translation_max_tokens = 8192
health_check_timeout = 60
layout = "preserve"

[queue]
source_root = "source"
max_cycles = 1000
apply = true
autonomous = true
finalize = true
stop_on_error = true
