[paths]
output_root = "output"
translation_policy = "docs/prompts/erotic-novel-policy.md"

[roles]
primary_translator = "nemotron"
fallback_translators = [
    "gemini_lite",
    "deepseek",
]
fallback_translator = "gemini_lite"
secondary_fallback_translator = "deepseek"
reviewer = "nemotron"
secondary_reviewer = "gemini_lite"
dual_review = true
fallback_reviewers = []

[providers.nemotron]
type = "openai"
base_url = "https://integrate.api.nvidia.com/v1"
model = "nvidia/llama-3.3-nemotron-super-49b-v1"
api_key = "$NVIDIA_API_KEY"
context_tokens = 131072
timeout = 600
thinking = false

[providers.nemotron.chat_template_kwargs]
thinking = false

[providers.gemini_lite]
type = "openai"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.5-flash-lite"
api_key = "$GEMINI_API_KEY"
context_tokens = 1048576
timeout = 600

[providers.deepseek]
type = "openai"
base_url = "https://integrate.api.nvidia.com/v1"
model = "deepseek-ai/deepseek-v4-flash-0731"
api_key = "$DEEPSEEK_API_KEY"
context_tokens = 131072
timeout = 600

[pipeline]
max_cycles = 1000
max_chapter_batches = 1000
primary_batch_max_chars = 1500
max_provider_split_depth = 2
split_on_content_filter = false
translation_max_tokens = 8192
health_check_timeout = 120
layout = "horizontal"

[queue]
source_root = "source"
max_cycles = 1000
apply = true
autonomous = true
finalize = true
stop_on_error = false
layout = "horizontal"
