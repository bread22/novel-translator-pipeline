[project]
name = "novel-translator-pipeline"
version = "0.1.0"
description = "Universal AI Novel Translation and Consistency Review Pipeline for Novel Translator"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["translator*"]

[tool.pytest.ini_options]
pythonpath = ["."]
